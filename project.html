<html>
    <head>
       <link rel="stylesheet" href="project.css" > <title> Vehicle Re-Identification Service</title>
    </head>
    <body id="background">
    <div class="title">
    <img src="car.png" , width="50px" height="50px" ><h3>Vehicle Re-Identification Service</h3>
</div>
<hr class="line">

<div class="main">

<div class="left">
<div class="Box">
    <h3 id="text">Query Photo</h3>

    <div class="smallBox" onclick="document.getElementById('fileInput').click()" style="cursor: pointer;">   
      <img class="upload"src="upload.png", width="50px" height="50px" >
        <h5 id="Drop">Drop a photo, or click to upload</h5>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
       <h4 id="bounding">Bounding box (x, y, w, h)</h4>
        <input type="text" class="input" id="boxx">
         <input type="text" class="inputs" id="boxy">
          <input type="text" class="inputs" id="boxw">
           <input type="text" class="inputs" id="boxh"> 
    <a  ><button id="box" >Search gallery</button></a>
    
</div>
 <div class="threshold-box">
            <h3>REFUSAL THRESHOLD</h3>
   <input type="range" min="0" max="1" step="0.01" value="0.50" class="slider" id="thresholdSlider">
<div class="slider-labels">
    <span>0.0</span>
    <span class="slider-value" id="thresholdValue">0.50</span>
    <span>1.0</span>
</div>
            <p class="threshold-text">Candidates below this similarity score are treated as no match, not a guess.</p>
        </div>
 </div>

<div class="ranked">
<div class="ranked-header">
    <div>
        <h3>Ranked candidates</h3>
        <p id="resultSummary">Upload a photo to search</p>
    </div>
    <span id="queryIdLabel" class="query-id-label"></span>
</div>
<div class="acc" id="resultsContainer"></div>
</div>

</div>
<script src="app.js"></script>
</body>
</html>
